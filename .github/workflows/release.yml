# release dalına gönderilince Windows kurulumunu derleyip GitHub Releases'a yükler.
# Etiket (v + Cargo.toml / tauri.conf.json sürümü) otomatik oluşturulur.
# Uygulama içi güncelleme latest.json dosyasını buradan okur.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - name: Point the updater at this repository
        shell: pwsh
        run: |
          $c = Get-Content tauri.conf.json -Raw
          $c.Replace('__REPO__', '${{ github.repository }}') | Set-Content tauri.conf.json -Encoding utf8NoBOM

      - name: Check the signing key
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:KEY) {
            Write-Output "::error::TAURI_SIGNING_PRIVATE_KEY secret is missing (Settings > Secrets and variables > Actions)"
            exit 1
          }
          if (-not $env:PASS) {
            Write-Output "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is missing (Settings > Secrets and variables > Actions)"
            exit 1
          }

      # Hata olursa son satırlar uyarı (annotation) olarak görünsün; kayıtları açmadan okunabilsin.
      - name: Build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build.log -Tail 25) -join '%0A'
            Write-Output "::error title=tauri build failed::$tail"
            exit 1
          }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Wazzap v__VERSION__
          releaseBody: |
            Download `Wazzap_*_x64-setup.exe` below and run it. Installed copies update themselves.
            Aşağıdaki `Wazzap_*_x64-setup.exe` dosyasını indirip çalıştır. Kurulu sürümler kendini günceller.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
